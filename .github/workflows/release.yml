name: Release PhonAcq (Android APK · Windows EXE · macOS DMG)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 2.0.3 或 v2.0.3）'
        required: true
        default: '2.0.3'
        type: string
      release_notes:
        description: '本次版本更新说明（支持 Markdown；留空则自动生成变更记录）'
        required: false
        default: ''
        type: string
      prerelease:
        description: '标记为预发布版本 (Pre-release)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8"

jobs:
  prepare:
    name: Validate & Normalize Version
    runs-on: ubuntu-latest
    outputs:
      raw_version: ${{ steps.norm.outputs.raw_version }}
      tag_name: ${{ steps.norm.outputs.tag_name }}
    steps:
      - name: Normalize version string
        id: norm
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          CLEAN_VER="$(echo "$INPUT_VERSION" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/^[vV]//')"
          if [ -z "$CLEAN_VER" ] || ! echo "$CLEAN_VER" | grep -qE '^[0-9]+(\.[0-9]+)*([.-][0-9A-Za-z._-]+)?$'; then
            echo "::error::版本号格式无效：'$INPUT_VERSION'（示例：2.0.2 或 v2.0.2）"
            exit 1
          fi
          echo "raw_version=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          echo "Normalized version: ${CLEAN_VER} (Tag: v${CLEAN_VER})"

  build-android:
    name: Build Android APK
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      apk_signed: ${{ steps.apk.outputs.apk_signed }}
      apk_filename: ${{ steps.apk.outputs.apk_filename }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Accept Licenses
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sudo chown -R "$USER" "$SDK_ROOT" || true
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::未在 ${SDK_ROOT}/cmdline-tools 下找到 sdkmanager"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Keystore & Build Android APK
        id: apk
        env:
          RAW_VERSION: ${{ needs.prepare.outputs.raw_version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          [ -f .env ] || cp .env.example .env

          # Ensure debug.keystore exists so Gradle signingConfigs evaluation succeeds cleanly
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          mkdir -p dist
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Detected release signing secrets; building signed Release APK..."
            KEYSTORE_FILE="${RUNNER_TEMP}/upload-key.jks"
            echo "$ANDROID_KEYSTORE_BASE64" | tr -d ' \n\r\t' | base64 -d > "$KEYSTORE_FILE"
            export KEYSTORE_PATH="$KEYSTORE_FILE"
            gradle :app:assembleRelease -PappVersion="${RAW_VERSION}" --no-daemon
            APK_SRC="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
            APK_NAME="PhonAcq-v${RAW_VERSION}-android.apk"
            cp "$APK_SRC" "dist/${APK_NAME}"
            rm -f "$KEYSTORE_FILE"
            echo "apk_signed=true" >> "$GITHUB_OUTPUT"
            echo "apk_filename=${APK_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::未检测到完整的 Android 签名密钥 (ANDROID_KEYSTORE_BASE64 / STORE_PASSWORD / KEY_PASSWORD)，自动回退生成可直接安装的 Debug 签名安装包。"
            gradle :app:assembleDebug -PappVersion="${RAW_VERSION}" --no-daemon
            APK_SRC="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
            APK_NAME="PhonAcq-v${RAW_VERSION}-android-debug.apk"
            cp "$APK_SRC" "dist/${APK_NAME}"
            echo "apk_signed=false" >> "$GITHUB_OUTPUT"
            echo "apk_filename=${APK_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android-apk
          path: dist/*.apk
          if-no-files-found: error

  build-windows:
    name: Build Windows x64 Installer (.exe)
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Package & Smoke-Verify Windows Installer (.exe)
        env:
          RAW_VERSION: ${{ needs.prepare.outputs.raw_version }}
        shell: pwsh
        run: |
          gradle -p desktop-windows packageWindowsSetup "-PappVersion=$env:RAW_VERSION" --no-daemon
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $setup = Get-ChildItem -Path "desktop-windows/build/installer/PhonAcq-v*-windows-x64-setup.exe" | Select-Object -First 1
          if (-not $setup) {
            Write-Error "未找到生成的 Windows .exe 安装包"
            exit 1
          }
          $dest = "dist/PhonAcq-v$($env:RAW_VERSION)-windows-x64-setup.exe"
          Copy-Item -Path $setup.FullName -Destination $dest -Force

          # Verify silent install + runtime/JAR integrity + same-version in-place overwrite + clean uninstall
          $smokeDir = Join-Path $env:RUNNER_TEMP "PhonAcqSmoke"
          $p1 = Start-Process -FilePath (Resolve-Path $dest).Path -ArgumentList "--silent", "--dir=$smokeDir" -Wait -PassThru
          $hasRuntimeModules = Test-Path (Join-Path $smokeDir "runtime\lib\modules")
          $hasAppJars = [bool](Get-ChildItem -Path (Join-Path $smokeDir "app") -Filter "*.jar" -ErrorAction SilentlyContinue)
          if ($p1.ExitCode -ne 0 -or -not (Test-Path (Join-Path $smokeDir "PhonAcq.exe")) -or -not (Test-Path (Join-Path $smokeDir "Uninstall-PhonAcq.exe")) -or -not $hasRuntimeModules -or -not $hasAppJars) {
            Write-Error "首次静默安装自检失败 (ExitCode=$($p1.ExitCode), runtime=$hasRuntimeModules, jars=$hasAppJars)"
            exit 1
          }
          $p2 = Start-Process -FilePath (Resolve-Path $dest).Path -ArgumentList "--silent", "--dir=$smokeDir" -Wait -PassThru
          if ($p2.ExitCode -ne 0 -or -not (Test-Path (Join-Path $smokeDir "PhonAcq.exe"))) {
            Write-Error "同版本号原位覆盖安装自检失败 (ExitCode=$($p2.ExitCode))"
            exit 1
          }
          $p3 = Start-Process -FilePath (Join-Path $smokeDir "Uninstall-PhonAcq.exe") -ArgumentList "--uninstall", "--silent" -Wait -PassThru
          if ($p3.ExitCode -ne 0) {
            Write-Error "卸载程序静默自检失败 (ExitCode=$($p3.ExitCode))"
            exit 1
          }
          $exeSizeMb = [math]::Round((Get-Item $dest).Length / 1MB, 2)
          Write-Host "Prepared & verified Windows Solid-LZMA EXE installer ($($exeSizeMb) MB): $dest"

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-exe
          path: dist/PhonAcq-v*-windows-x64-setup.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS Apple Silicon (.dmg)
    needs: prepare
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (arm64)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          architecture: 'aarch64'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build, Sign Entitlements & Package macOS Apple Silicon (.dmg)
        env:
          RAW_VERSION: ${{ needs.prepare.outputs.raw_version }}
        run: |
          gradle -p desktop-windows createReleaseDistributable -PappVersion="${RAW_VERSION}" --no-daemon

          APP_BUNDLE="$(find desktop-windows/build/compose/binaries/main-release/app -maxdepth 1 -name '*.app' 2>/dev/null | head -n 1)"
          if [ -z "$APP_BUNDLE" ] || [ ! -d "$APP_BUNDLE" ]; then
            APP_BUNDLE="$(find desktop-windows/build/compose/binaries/main/app -maxdepth 1 -name '*.app' 2>/dev/null | head -n 1)"
          fi
          if [ -z "$APP_BUNDLE" ] || [ ! -d "$APP_BUNDLE" ]; then
            echo "::error::未找到生成的 macOS .app 应用包"
            exit 1
          fi
          echo "Built release app bundle: $APP_BUNDLE"

          # Ad-hoc sign Mach-O binaries inside bundled JVM runtime with runtime entitlements,
          # then sign the runtime bundle and outer PhonAcq.app bundle with microphone & network entitlements
          if [ -d "$APP_BUNDLE/Contents/runtime" ]; then
            while IFS= read -r -d '' f; do
              if file "$f" | grep -q "Mach-O"; then
                codesign --force --sign - --entitlements desktop-windows/runtime-entitlements.plist "$f"
              fi
            done < <(find "$APP_BUNDLE/Contents/runtime" -type f -print0)
            codesign --force --sign - --entitlements desktop-windows/runtime-entitlements.plist "$APP_BUNDLE/Contents/runtime"
          fi
          while IFS= read -r -d '' f; do
            if file "$f" | grep -q "Mach-O"; then
              codesign --force --sign - --entitlements desktop-windows/entitlements.plist "$f"
            fi
          done < <(find "$APP_BUNDLE/Contents/MacOS" -type f -print0)
          codesign --force --sign - --entitlements desktop-windows/entitlements.plist "$APP_BUNDLE"
          codesign --verify --verbose=2 "$APP_BUNDLE"

          STAGING_DIR="${RUNNER_TEMP}/dmg-staging"
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR" dist
          cp -R "$APP_BUNDLE" "$STAGING_DIR/PhonAcq.app"
          ln -s /Applications "$STAGING_DIR/Applications"

          # Package using Apple-native ULMO (LZMA) compression — 100% supported by Finder on all Apple Silicon Macs (macOS 11+)
          DEST="dist/PhonAcq-v${RAW_VERSION}-macos-arm64.dmg"
          hdiutil create \
            -volname "PhonAcq v${RAW_VERSION}" \
            -srcfolder "$STAGING_DIR" \
            -ov \
            -format ULMO \
            "$DEST"

          # Mount-verify the ULMO DMG & signature integrity
          MOUNT_DIR="${RUNNER_TEMP}/dmg-verify"
          rm -rf "$MOUNT_DIR"
          mkdir -p "$MOUNT_DIR"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_DIR" "$DEST"
          if [ ! -x "$MOUNT_DIR/PhonAcq.app/Contents/MacOS/PhonAcq" ]; then
            hdiutil detach "$MOUNT_DIR" || true
            echo "::error::ULMO DMG 挂载自检失败：未找到可执行文件 PhonAcq"
            exit 1
          fi
          codesign --verify --verbose=2 "$MOUNT_DIR/PhonAcq.app"
          hdiutil detach "$MOUNT_DIR"
          ls -lh "$DEST"

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-dmg
          path: dist/PhonAcq-v*-macos-arm64.dmg
          if-no-files-found: error

  build-macos-intel:
    name: Build macOS Intel x64 (.dmg)
    needs: prepare
    runs-on: macos-15-intel
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (x64)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          architecture: 'x64'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build, Sign Entitlements & Package macOS Intel x64 (.dmg)
        env:
          RAW_VERSION: ${{ needs.prepare.outputs.raw_version }}
        run: |
          gradle -p desktop-windows createReleaseDistributable -PappVersion="${RAW_VERSION}" --no-daemon

          APP_BUNDLE="$(find desktop-windows/build/compose/binaries/main-release/app -maxdepth 1 -name '*.app' 2>/dev/null | head -n 1)"
          if [ -z "$APP_BUNDLE" ] || [ ! -d "$APP_BUNDLE" ]; then
            APP_BUNDLE="$(find desktop-windows/build/compose/binaries/main/app -maxdepth 1 -name '*.app' 2>/dev/null | head -n 1)"
          fi
          if [ -z "$APP_BUNDLE" ] || [ ! -d "$APP_BUNDLE" ]; then
            echo "::error::未找到生成的 macOS (Intel) .app 应用包"
            exit 1
          fi
          echo "Built Intel release app bundle: $APP_BUNDLE"

          # Ad-hoc sign Mach-O binaries inside bundled JVM runtime with runtime entitlements,
          # then sign the runtime bundle and outer PhonAcq.app bundle with microphone & network entitlements
          if [ -d "$APP_BUNDLE/Contents/runtime" ]; then
            while IFS= read -r -d '' f; do
              if file "$f" | grep -q "Mach-O"; then
                codesign --force --sign - --entitlements desktop-windows/runtime-entitlements.plist "$f"
              fi
            done < <(find "$APP_BUNDLE/Contents/runtime" -type f -print0)
            codesign --force --sign - --entitlements desktop-windows/runtime-entitlements.plist "$APP_BUNDLE/Contents/runtime"
          fi
          while IFS= read -r -d '' f; do
            if file "$f" | grep -q "Mach-O"; then
              codesign --force --sign - --entitlements desktop-windows/entitlements.plist "$f"
            fi
          done < <(find "$APP_BUNDLE/Contents/MacOS" -type f -print0)
          codesign --force --sign - --entitlements desktop-windows/entitlements.plist "$APP_BUNDLE"
          codesign --verify --verbose=2 "$APP_BUNDLE"

          STAGING_DIR="${RUNNER_TEMP}/dmg-staging"
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR" dist
          cp -R "$APP_BUNDLE" "$STAGING_DIR/PhonAcq.app"
          ln -s /Applications "$STAGING_DIR/Applications"

          # Package using UDBZ (bzip2) compression for compatibility across macOS 10.15+ Intel Macs
          DEST="dist/PhonAcq-v${RAW_VERSION}-macos-x64.dmg"
          hdiutil create \
            -volname "PhonAcq v${RAW_VERSION}" \
            -srcfolder "$STAGING_DIR" \
            -ov \
            -format UDBZ \
            "$DEST"

          # Mount-verify the UDBZ DMG, x86_64 architecture & signature integrity
          MOUNT_DIR="${RUNNER_TEMP}/dmg-verify"
          rm -rf "$MOUNT_DIR"
          mkdir -p "$MOUNT_DIR"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_DIR" "$DEST"
          if [ ! -x "$MOUNT_DIR/PhonAcq.app/Contents/MacOS/PhonAcq" ]; then
            hdiutil detach "$MOUNT_DIR" || true
            echo "::error::UDBZ DMG 挂载自检失败：未找到可执行文件 PhonAcq"
            exit 1
          fi
          if ! file "$MOUNT_DIR/PhonAcq.app/Contents/MacOS/PhonAcq" | grep -q "x86_64"; then
            hdiutil detach "$MOUNT_DIR" || true
            echo "::error::架构校验失败：PhonAcq 可执行文件并非 x86_64"
            exit 1
          fi
          codesign --verify --verbose=2 "$MOUNT_DIR/PhonAcq.app"
          hdiutil detach "$MOUNT_DIR"
          ls -lh "$DEST"

      - name: Upload macOS Intel DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-x64-dmg
          path: dist/PhonAcq-v*-macos-x64.dmg
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build-android
      - build-windows
      - build-macos
      - build-macos-intel
    runs-on: ubuntu-latest
    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compose Release Notes & SHA-256 Checksums
        id: notes
        env:
          RAW_VERSION: ${{ needs.prepare.outputs.raw_version }}
          USER_NOTES: ${{ inputs.release_notes }}
          APK_SIGNED: ${{ needs.build-android.outputs.apk_signed }}
          APK_FILENAME: ${{ needs.build-android.outputs.apk_filename }}
        run: |
          ls -lh release-assets/

          BODY_FILE="${RUNNER_TEMP}/release_body.md"
          : > "$BODY_FILE"

          if [ -n "$(echo "$USER_NOTES" | tr -d '[:space:]')" ]; then
            printf "%s\n\n---\n\n" "$USER_NOTES" >> "$BODY_FILE"
            echo "auto_notes=false" >> "$GITHUB_OUTPUT"
          else
            echo "auto_notes=true" >> "$GITHUB_OUTPUT"
          fi

          cat <<EOF >> "$BODY_FILE"
          ### 安装包下载指引

          | 平台 | 文件名 | 适用设备与安装说明 |
          | :--- | :--- | :--- |
          | **Android**（手机 / 平板） | \`${APK_FILENAME}\` | Android 7.0+ 通用安装包（含双机无线联动看读端/遥控端） |
          | **Windows**（64 位） | \`PhonAcq-v${RAW_VERSION}-windows-x64-setup.exe\` | Windows 10 / 11 简体中文安装程序（支持同版本/跨版本直接覆盖更新） |
          | **macOS**（Apple Silicon） | \`PhonAcq-v${RAW_VERSION}-macos-arm64.dmg\` | 适用于 M1 / M2 / M3 / M4 系列芯片 Mac |
          | **macOS**（Intel 芯片） | \`PhonAcq-v${RAW_VERSION}-macos-x64.dmg\` | 适用于 Intel 处理器款 Mac（支持 macOS 10.15+） |

          > **macOS 首次打开提示**：由于安装包采用开源构建而未附加 Apple 付费商业公证，首次拖入「应用程序」打开若提示无法验证开发者，请前往 **系统设置 → 隐私与安全性** 底部点击 **「仍要打开」**，或在终端执行 \`xattr -cr /Applications/PhonAcq.app\` 即可正常使用。
          EOF

          # Remove leading indentation from heredoc
          sed -i -E 's/^          //' "$BODY_FILE"

          if [ "$APK_SIGNED" != "true" ]; then
            printf "\n> 注：当前 Android 安装包使用测试签名构建；如需发布正式签名包，可在仓库 Secrets 中配置 \`ANDROID_KEYSTORE_BASE64\`、\`STORE_PASSWORD\` 与 \`KEY_PASSWORD\`。\n" >> "$BODY_FILE"
          fi

          {
            printf "\n<details>\n<summary>SHA-256 文件校验值</summary>\n\n\`\`\`text\n"
            (cd release-assets && sha256sum * | sort -k2)
            printf "\`\`\`\n</details>\n"
          } >> "$BODY_FILE"

          echo "body_path=${BODY_FILE}" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: PhonAcq ${{ needs.prepare.outputs.tag_name }}
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: ${{ steps.notes.outputs.auto_notes == 'true' }}
          prerelease: ${{ inputs.prerelease }}
          overwrite_files: true
          files: |
            release-assets/*.apk
            release-assets/*.exe
            release-assets/*.dmg

  sync-release-metadata:
    name: Sync README, CITATION & Portal Version
    needs:
      - prepare
      - build-android
      - publish-release
    if: ${{ !inputs.prerelease && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update README.md, CITATION.cff and docs metadata
        env:
          RAW_VERSION: ${{ needs.prepare.outputs.raw_version }}
          APK_FILENAME: ${{ needs.build-android.outputs.apk_filename }}
        run: |
          RELEASE_DATE="$(TZ='Asia/Shanghai' date +%Y-%m-%d)"
          python3 .github/scripts/sync_release_metadata.py \
            --version "$RAW_VERSION" \
            --date "$RELEASE_DATE" \
            --apk-filename "$APK_FILENAME"

      - name: Commit & Push Synced Docs (if changed)
        env:
          RAW_VERSION: ${{ needs.prepare.outputs.raw_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CITATION.cff docs/index.html docs/sitemap.xml
          if git diff --cached --quiet; then
            echo "All release links and metadata already match v${RAW_VERSION}."
            exit 0
          fi
          git commit -m "chore(docs): sync README, CITATION.cff and portal to v${RAW_VERSION} [skip ci]"
          git pull --rebase origin main
          git push origin main
